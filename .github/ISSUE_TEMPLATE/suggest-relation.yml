name: 建议内容关联
description: 提出跨问题或跨分支的连接，并说明理由。
title: "[建议内容关联] "
body:
  - type: markdown
    attributes:
      value: "投稿在 GitHub
        公开，通过格式和引用检查后自动收录到网站，无需逐条人工审批。写下问题或回答即可，来源补充可以留空。不需要再修改上方已经填好的 Issue
        标题。请保留表单标题，正文中同名的 ### 标题请放入闭合的代码围栏。"
  - type: input
    id: source_id
    attributes:
      label: 来源内容
      description: 网站已自动填写，无需修改。
    validations:
      required: true
  - type: input
    id: target_id
    attributes:
      label: 另一段内容
      description: 在网站选择内容会自动填写，也可粘贴具体问题版本或回答的完整链接。
    validations:
      required: true
  - type: dropdown
    id: relation_type
    attributes:
      label: 关联类型
      options:
        - 主题相关
        - 观点支持
        - 观点冲突
      default: 0
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: 关联理由
      description: 支持/冲突请说明具体论点与适用条件。相似度本身不证明逻辑关系。
    validations:
      required: true
  - type: textarea
    id: source_excerpt
    attributes:
      label: 来源原文片段
      description: 观点支持/冲突必需，须与原文一致。
    validations:
      required: false
  - type: textarea
    id: target_excerpt
    attributes:
      label: 目标原文片段
      description: 观点支持/冲突必需，须与原文一致。
    validations:
      required: false
  - type: checkboxes
    id: public_consent
    attributes:
      label: 公开提交确认
      options:
        - label: 我理解投稿会在 GitHub 公开，并允许项目保留署名、展示和必要格式整理；我有权公开这些内容，且未包含密钥或敏感信息。
          required: true
