name: 提交已有答案
description: 分享自己的回答，或一份已有的 AI 回答。
title: "[提交已有答案] "
body:
  - type: markdown
    attributes:
      value: "投稿在 GitHub
        公开，通过格式和引用检查后自动收录到网站，无需逐条人工审批。写下问题或回答即可，来源补充可以留空。不需要再修改上方已经填好的 Issue
        标题。请保留表单标题，正文中同名的 ### 标题请放入闭合的代码围栏。"
  - type: input
    id: question_revision_id
    attributes:
      label: 回答位置
      description: 网站已自动填写，无需修改。也可粘贴具体问题版本的完整链接。
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: 答案正文
      description: 可以写自己的想法，也可以粘贴已有回答。引用他人或 AI 内容时，可在来源补充中注明。
    validations:
      required: true
  - type: textarea
    id: context_note
    attributes:
      label: 来源补充（选填）
      description: 可以写“我自己的想法”、AI 名称、参考链接，或实际提问与背景；知道多少写多少，不清楚就留空。
    validations:
      required: false
  - type: checkboxes
    id: public_consent
    attributes:
      label: 公开提交确认
      options:
        - label: 我理解投稿会在 GitHub 公开，并允许项目保留署名、展示和必要格式整理；我有权公开这些内容，且未包含密钥或敏感信息。
          required: true
