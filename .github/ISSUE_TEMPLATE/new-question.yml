name: 提个新问题
description: 保存一个值得继续探索的问题，也可以附带已有答案。
title: "[提个新问题] "
body:
  - type: markdown
    attributes:
      value: "投稿在 GitHub
        公开，通过格式和引用检查后自动收录到网站，无需逐条人工审批。写下问题或回答即可，来源补充可以留空。不需要再修改上方已经填好的 Issue
        标题。请保留表单标题，正文中同名的 ### 标题请放入闭合的代码围栏。"
  - type: textarea
    id: body
    attributes:
      label: 问题正文
      description: 直接写下你想问的事，第一行会用作标题；背景可以接着写，不用重复填写。
    validations:
      required: true
  - type: textarea
    id: answer_body
    attributes:
      label: 已有答案（选填）
    validations:
      required: false
  - type: textarea
    id: context_note
    attributes:
      label: 来源补充（选填）
      description: 可以写“我自己的想法”、AI 名称、参考链接，或实际提问与背景；知道多少写多少，不清楚就留空。
    validations:
      required: false
  - type: checkboxes
    id: public_consent
    attributes:
      label: 公开提交确认
      options:
        - label: 我理解投稿会在 GitHub 公开，并允许项目保留署名、展示和必要格式整理；我有权公开这些内容，且未包含密钥或敏感信息。
          required: true
