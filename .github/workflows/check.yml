name: Check content and site
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - name: Validate historical content
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run validate -- --base "$BASE_SHA"
      - run: npm run check
      - run: npm test
      - run: npm run verify:export
      - name: Build with the GitHub Pages base path
        env:
          SITE_URL: https://billshiyaozhang.github.io
          SITE_BASE: /QandA
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check actual publication build
        env:
          TEST_BASE_PATH: /QandA
        run: npm run test:production
      - name: Browser acceptance tests
        env:
          TEST_BASE_PATH: /QandA
        run: npm run test:e2e
